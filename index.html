<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보부장 업무매뉴얼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: 좌측 단계 목록(잠금/완료 표시) + 우측 현재 단계 카드. 체크를 모두 마치면 다음 단계가 열린다. */
:root{
  --paper:#f4f5f2; --card:#ffffff; --ink:#1d2a2a; --muted:#5d6b6a; --line:#d9dedb;
  --accent:#1f5f5b; --accent-soft:#e1efed;
  --warn:#8a5a00; --warn-bg:#fff3d6; --warn-line:#e8c26a;
  --ok:#2e7d46; --ok-bg:#e3f3e8; --lock:#98a3a1;
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141a1a; --card:#1c2424; --ink:#e6ecea; --muted:#9db0ad; --line:#2f3b3a;
    --accent:#6cc4bb; --accent-soft:#1f3533;
    --warn:#f0c15c; --warn-bg:#3a2f12; --warn-line:#6d5718;
    --ok:#6fcf8b; --ok-bg:#1c3425; --lock:#66736f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141a1a; --card:#1c2424; --ink:#e6ecea; --muted:#9db0ad; --line:#2f3b3a;
  --accent:#6cc4bb; --accent-soft:#1f3533;
  --warn:#f0c15c; --warn-bg:#3a2f12; --warn-line:#6d5718;
  --ok:#6fcf8b; --ok-bg:#1c3425; --lock:#66736f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px 12px;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:'title tools' 'tabs ctrl';gap:10px 16px;align-items:center}.t-title{grid-area:title;min-width:0}.tools{grid-area:tools;justify-self:end}.tabs{grid-area:tabs}.ctrl{grid-area:ctrl;display:flex;align-items:center;gap:14px;justify-content:flex-end;min-height:36px}.btn.sm{padding:4px 10px;font-size:13px}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:13px}
.prog{width:140px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.prog b{font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.btn.primary:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.btn.danger{border-color:var(--warn-line);color:var(--warn)}
.toggle{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}

main{max-width:1120px;margin:0 auto;padding:16px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
nav.steps{position:sticky;top:78px;max-height:calc(100vh - 94px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.grp{font-size:12px;color:var(--muted);font-weight:700;padding:10px 10px 4px;letter-spacing:.02em}
.st{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:8px;padding:8px 10px;cursor:pointer}
.st:hover:not(:disabled){background:var(--accent-soft)}
.st[aria-current="step"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.st:disabled{cursor:not-allowed;color:var(--lock)}
.dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.st.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.st.cur .dot{border-color:var(--accent);color:var(--accent)}
.st.lock .dot{border-style:dashed}
.st .t{flex:1;min-width:0;font-size:14px}
.st .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

article.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.eyebrow{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.03em}
article h2{font-size:24px;margin:2px 0 10px;line-height:1.3;text-wrap:balance;letter-spacing:-.015em}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{font-size:12.5px;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:500}
.lead{color:var(--muted);margin:8px 0 0;max-width:68ch}
section.blk{margin-top:22px}
section.blk h3{font-size:15px;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.cnt{font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
ul.chk{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.chk label{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;background:var(--card)}
ul.chk label:hover{border-color:var(--accent)}
ul.chk input{flex:none;width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
ul.chk .tx{flex:1;min-width:0}
ul.chk li.on label{background:var(--ok-bg);border-color:transparent}
ul.chk li.on .tx>span:first-child{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
ul.chk .sm{display:block;font-size:13px;color:var(--muted);margin-top:2px}
ul.warn label{background:var(--warn-bg);border-color:var(--warn-line)}
ul.warn li.on label{background:var(--ok-bg);border-color:transparent}
ul.warn h3,.warnh{color:var(--warn)}
.tag.req{background:var(--accent);color:var(--card)}
.tag.aud{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent)}
.tabs{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;max-width:100%;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;justify-self:start;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:none;white-space:nowrap;border:0;background:transparent;border-radius:9px;padding:7px 14px;font-size:14px;color:var(--ink)}.tab:hover{background:var(--line)}.tab[aria-pressed="true"]:hover{background:var(--accent)}.tab[aria-pressed="true"]{box-shadow:0 1px 3px rgba(0,0,0,.25)}.tab{cursor:pointer;font-weight:700}.tab[aria-pressed="true"]{background:var(--accent);color:#fff}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px;background:var(--warn);color:var(--warn-bg);vertical-align:1px}
details.more{margin:4px 0 0 32px}
details.more summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--accent);padding:4px 0}
details.more dl{margin:4px 0 6px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:14px}
details.more dt{font-weight:700;margin-top:8px}details.more dt:first-child{margin-top:0}
details.more dd{margin:2px 0 0}details.more dd ul{margin:2px 0 0;padding-left:18px}
.note{margin-top:22px;border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap;align-items:center}
.hint{font-size:13px;color:var(--muted)}
.done-banner{margin-top:16px;padding:12px 14px;border-radius:10px;background:var(--ok-bg);color:var(--ok);font-weight:700}
pre.tree{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:13px;line-height:1.5;margin:8px 0 0}
.finish{text-align:center;padding:16px 0}
.finish h2{font-size:26px}

@media (max-width:1040px){.top-in{grid-template-columns:minmax(0,1fr);grid-template-areas:'title' 'tools' 'tabs' 'ctrl'}.tools{justify-self:start}.ctrl{justify-content:space-between}.prog{flex:1;width:auto}}
@media (max-width:820px){
  main{grid-template-columns:minmax(0,1fr)}
  nav.steps{position:static;max-height:none;display:none}
  nav.steps.open{display:block}
  .mnav{display:inline-flex}
  article.card{padding:18px 16px}
  .top h1{font-size:16px}
  .top-in{grid-template-columns:minmax(0,1fr);grid-template-areas:'title' 'tools' 'tabs' 'ctrl'}
  .tools{justify-self:start;flex-wrap:wrap}.ctrl{justify-content:space-between}.prog{flex:1;width:auto}
}
@media (min-width:821px){.mnav{display:none}}
@media (min-width:821px){html,body{height:100%}body{display:flex;flex-direction:column;height:100vh;overflow:hidden}header.top{position:relative;flex:none}main{flex:1;min-height:0;width:100%;grid-template-rows:minmax(0,1fr);align-items:stretch;overflow:hidden}nav.steps{position:static;max-height:none;height:100%;overflow:auto}article#view{min-height:0;height:100%;overflow:auto}}
@media print{html,body{height:auto!important;overflow:visible!important;display:block!important}main,article#view{height:auto!important;overflow:visible!important;display:block!important}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
.rel .relrow{display:flex;gap:10px;align-items:flex-start;margin:6px 0}.rel .relrow .tag{flex:none;margin-top:2px}.rel ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6}.rel .btn{margin-top:6px}
.loc{margin:4px 0 2px 28px;padding:6px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-size:13px;line-height:1.5}.loc b{color:var(--accent);margin-right:4px}.loc.mon{border-left-color:#c98a1b;background:rgba(201,138,27,.12)}.loc.mon b{color:#c98a1b}.loc .live{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}.loc .live li{display:flex;gap:8px;flex-wrap:wrap}.loc .live span{color:var(--muted)}.loc .live i{font-weight:400;color:var(--muted)}.loc .btn.sm{margin-left:6px;padding:2px 8px}
.fld{margin:6px 0 2px 28px;display:grid;gap:6px}.fld b{font-size:13px;color:var(--muted)}.fld label{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:8px;align-items:center;font-size:13px}@media (max-width:820px){.fld label{grid-template-columns:1fr}}
.uses{display:grid;gap:8px}.use{display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper)}
.use.col{flex-direction:column;align-items:stretch}.sm2{font-size:13px;color:var(--muted)}
.urlrow{display:flex;gap:8px}.url{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;background:var(--card);color:var(--ink)}
.use a.btn,.urlrow a.btn{text-decoration:none;white-space:nowrap}

body.monthly main{grid-template-columns:minmax(0,1fr)}body.monthly nav.steps{display:none}.modeguide{font-size:13px;color:var(--muted);margin:0 0 12px;padding:8px 12px;background:var(--paper);border:1px solid var(--line);border-radius:10px}.modeguide b{color:var(--ink)}.modeguide span{margin-left:6px}
body.monthly .ctrl,body.monthly #reset{visibility:hidden}body.monthly .mnav{display:none!important}
.prevbox{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;color:#111;overflow:auto;font-size:13px}
select.url{padding:6px 8px}
.gbox{margin:10px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}.gtitle{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:6px 12px}
table.gt{width:100%;border-collapse:collapse;font-size:14px}table.gt th{text-align:left;background:var(--paper);padding:6px 10px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}table.gt td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}table.gt input{width:100%}
@media print{@page{size:A4;margin:15mm}body *{visibility:hidden!important}#monPrev,#monPrev *{visibility:visible!important}#monPrev{position:absolute;left:0;top:0;width:100%;border:0!important;padding:0!important;background:#fff}}

.att{margin:6px 0 6px 32px;padding:8px 12px;border:1px dashed var(--line);border-radius:8px}
.files{list-style:none;margin:6px 0;padding:0;display:grid;gap:6px}.files li{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.thumb{width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}.upl{cursor:pointer;display:inline-block}
body.locked header.top,body.locked main{display:none}
#lock{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px}
body.locked #lock{display:flex}
.lockbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;text-align:center}
.lockbox h1{margin:0 0 4px;font-size:22px;cursor:default;user-select:none;-webkit-user-select:none}
.lockbox p{margin:0 0 16px;color:var(--muted);font-size:14px}
.lockbox input{width:100%;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:18px;text-align:center;letter-spacing:.3em;background:var(--paper);color:var(--ink)}
.lockbox .btn{width:100%;padding:10px}
#lockMsg{min-height:22px;margin-top:10px;font-size:14px;color:var(--warn)}

.rolebtns{display:flex;flex-direction:column;gap:8px}
.rolebtn{width:100%;padding:12px;display:flex;gap:8px;justify-content:center;align-items:baseline}
.rolebtn span{font-size:13px;color:var(--muted)}
.lockbox #nm{width:100%;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-size:18px;text-align:center;background:var(--paper);color:var(--ink)}
#lockMsg.ok{color:var(--ok,#1a7a4c)}
.who{font-size:13px;font-weight:700;margin-right:4px}
.sync{margin-right:6px}.sync.bad{color:#b3261e}
#adm{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#adm[hidden]{display:none}
.admbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.admbox h2{margin:0 0 6px;font-size:18px}.admbox h3{margin:14px 0 4px;font-size:15px}
.admt{width:100%;border-collapse:collapse;font-size:14px}.admt th,.admt td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.admbox textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--paper);color:var(--ink)}
.admrow{margin-top:8px;display:flex;gap:10px;align-items:center}
.warnb{color:#b3261e}
</style>
</head>
<body class="locked">
<div id="lock"><div class="lockbox"><h1 id="lockTitle">정보부장 업무매뉴얼</h1><p id="lockSub">불러오는 중...</p>
<div id="roleBtns" class="rolebtns"></div>
<form id="lockForm" autocomplete="off" style="display:none"><input type="text" id="nm" autocomplete="off" aria-label="이름" placeholder="이름" style="display:none;letter-spacing:normal"><input type="password" id="pw1" autocomplete="off" aria-label="암호"><input type="password" id="pw2" autocomplete="off" aria-label="새 암호 확인" style="display:none"><button class="btn primary" type="submit" id="lockBtn">들어가기</button><button class="btn" type="button" id="lockBack" style="display:none;margin-top:8px">다른 사람으로 들어가기</button><button class="btn" type="button" id="lockCancel" style="display:none;margin-top:8px">취소</button></form>
<div id="lockMsg" role="status"></div></div></div>
<div id="adm" hidden><div class="admbox"><h2>담당자 관리</h2><p class="sm2">담당자를 바꾸거나 1년이 지났을 때 초기화합니다. 초기화하면 이름과 암호가 지워지고(암호 6120), 새 담당자가 첫 접속 때 이름과 새 암호를 정합니다.</p><div id="admBody"></div><h3>기존 데이터 가져오기</h3><p class="sm2">Claude 화면의 매뉴얼에서 "데이터 복사"로 복사한 내용을 붙여 넣습니다. 서버의 체크·입력 내용이 덮어써집니다. 사진·PDF는 가져오지 않으니 다시 올려야 합니다.</p><textarea id="impTxt" rows="3" placeholder="여기에 붙여 넣기"></textarea><div class="admrow"><button class="btn" type="button" id="impGo">가져오기</button><span id="admMsg" class="sm2"></span></div><div class="admrow"><button class="btn primary" type="button" id="admClose">닫기</button></div></div></div>
<header class="top">
  <div class="top-in">
    <div class="t-title">
      <h1>정보부장 업무매뉴얼</h1>
      <div class="sub" id="sub">정보 업무 따라하기 · 정보감사 대비를 문서별로 · 체크하면 다음 단계가 열립니다</div>
    </div>
    <div class="tools">
      <button class="btn mnav" id="mnav" type="button">단계 목록</button>
      <span class="who" id="who"></span><span class="sm2 sync" id="sync"></span>
      <button class="btn sm" id="adm_open" type="button" style="display:none">담당자 관리</button>
      <button class="btn sm" id="chgpw" type="button">이름·암호 변경</button>
      <button class="btn sm" id="dolock" type="button">로그아웃</button>
      <button class="btn sm danger" id="reset" type="button">처음부터</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="ctrl">

      <div class="prog"><div class="bar" aria-hidden="true"><i id="barFill"></i></div><b id="progTxt">0%</b></div>
    </div>
  </div>
</header>
<main>
  <nav class="steps" id="nav" aria-label="단계 목록"></nav>
  <article class="card" id="view" aria-live="polite"></article>
</main>

<script>
function scTo(a,b){var e=window.matchMedia('(min-width:821px)').matches?document.getElementById('view'):null;if(e){if(typeof a==='object')e.scrollTo(a);else e.scrollTo(a,b);}else{if(typeof a==='object')window.scrollTo(a);else window.scrollTo(a,b);}}
function scY(){return window.matchMedia('(min-width:821px)').matches?document.getElementById('view').scrollTop:window.scrollY;}
/* ---------- 내용 ---------- */
/* w: 확인 필요(2025 지적사항 등). n: 2025 정보보호 감사에서 해당 분야 지적을 받은 학교 수 */
var HL='홈페이지 관리자 페이지에서 확인합니다.';
var ALL = [
 {id:'s0', part:'시작', title:'권한 인계와 증빙 폴더 준비', cov:'공통',
  basis:'2026년도 학교 보안 감사 및 컨설팅 추진 계획', when:'감사 안내 공문 접수 직후',
  lead:'감사는 서면 자료 검토(1차)와 미흡 사항 컨설팅(2차, 유선 또는 방문) 순서로 진행됩니다. 문서를 점검하기 전에 접속 권한과 폴더부터 갖춥니다.',

var DEVKEY='suip_dev_v1';
var state={checks:{},cur:0,free:false,urls:{},info:{},custom:[],mode:'manual',curs:{}};
try{var dv0=JSON.parse(localStorage.getItem(DEVKEY)||'null');if(dv0){if(dv0.cur>=0)state.cur=dv0.cur;if(dv0.mode&&MODES[dv0.mode])state.mode=dv0.mode;if(dv0.curs)state.curs=dv0.curs;}}catch(e){}
function save(){try{localStorage.setItem(DEVKEY,JSON.stringify({cur:state.cur,mode:state.mode,curs:state.curs}));}catch(e){}if(window.SYNC)window.SYNC.dirty();}

function items(s){
  var a=[];
  if(s.sitesStep){allSites().forEach(function(x){a.push({k:'site.'+x.id,kind:'t',txt:x.name+' 관리자 권한을 이전 담당자에게 인계받았다',sm:x.todo,sum:x.id});});}
  s.todo.forEach(function(t,i){a.push({k:s.id+'.t'+i,kind:'t',txt:t[0],sm:t[1],req:!!t[2],aud:!!t[3]});});
  (s.warn||[]).forEach(function(t,i){a.push({k:s.id+'.w'+i,kind:'w',txt:t[0],sm:t[1],n:t[2]});});
  (s.ev||[]).forEach(function(t,i){
    if(t.indexOf('제출 자료 없음')===0)return;
    a.push({k:s.id+'.e'+i,kind:'e',txt:t});
  });
  return a;
}
function stat(s){var it=items(s),d=0;it.forEach(function(x){if(state.checks[x.k])d++;});return{done:d,total:it.length};}
function isDone(i){var t=stat(STEPS[i]);return t.total>0&&t.done===t.total;}
function unlockedStrict(i){return state.free||i===0||isDone(i-1);}

/* ---------- 화면 ---------- */
document.addEventListener('toggle',function(e){var t=e.target;if(t&&t.dataset&&t.dataset.d)openDet[t.dataset.d]=t.open;},true);
var navEl=document.getElementById('nav'),view=document.getElementById('view');
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}

function renderNav(){
  var h='',last='';
  STEPS.forEach(function(s,i){
    if(s.part!==last){h+='<div class="grp">'+esc(s.part)+'</div>';last=s.part;}
    var st=stat(s),done=isDone(i),open=unlockedStrict(i);
    var cls='st'+(done?' done':'')+(i===state.cur?' cur':'')+(!open?' lock':'');
    var label=i===STEPS.length-1?'끝':String(i);
    h+='<button type="button" class="'+cls+'" data-i="'+i+'"'+(open?'':' disabled')+(i===state.cur?' aria-current="step"':'')+'>'
      +'<span class="dot">'+(done?'✓':(open?esc(label):'🔒'))+'</span>'
      +'<span class="t">'+esc(s.title)+'</span><span class="n">'+st.done+'/'+st.total+'</span></button>';
  });
  navEl.innerHTML=h;
}
function renderProgress(){
  var D=0,T=0;STEPS.forEach(function(s){var t=stat(s);D+=t.done;T+=t.total;});
  var pct=T?Math.round(D/T*100):0;
  document.getElementById('barFill').style.width=pct+'%';
  document.getElementById('progTxt').textContent=pct+'% ('+D+'/'+T+')';
}
var openDet={};
function detBlock(k){
  var d=DET[k];if(!d)return '';
  var h='<details class="more" data-d="'+k+'"'+(openDet[k]?' open':'')+'><summary>쉽게 풀어 보기</summary><dl>';
  d.forEach(function(r){
    h+='<dt>'+esc(r[0])+'</dt><dd>';
    if(Array.isArray(r[1])){h+='<ul>'+r[1].map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';}
    else h+=esc(r[1]);
    h+='</dd>';
  });
  return h+'</dl></details>';
}

 "영상정보처리기기 운영·관리 방침 4번(설치 대수, 설치 위치 및 촬영범위)", "m10.t1": "영상정보처리기기 운영·관리 방침 2번(관리책임자, 운영담당자·접근권한자)", "m10.t3": "개인영상정보 내부 관리계획 제2장 제4·5조(수립, 공표), 맨 앞 개정 이력", "m10.t4": "개인영상정보 내부 관리계획 제12조(이용·제공·파기 기록), 제15조(관리대장)", "m10.t5": "개인영상정보 내부 관리계획 제9조(안내판의 설치)", "m10.t6": "개인영상정보 내부 관리계획 제14조(열람 등 요구) / 영상정보처리기기 운영·관리 방침 7번", "m11.t0": "정보보안 종합계획 6. 정보보안 및 개인정보보호 관련 업무 담당자 지정 표", "m11.t1": "영상정보처리기기 운영·관리 방침 4번(설치 현황)", "m11.t4": "개인정보 내부 관리계획 제6조(이행 실태 점검) / 개인정보 보호 업무 추진계획 Ⅲ-7", "m11.t5": "정보보안 종합계획 5. > 다 \"개인정보 유·노출 예방활동\" 칸 > 가", "m12.t0": "정보보안 종합계획 4. \"정보보안사고대응\" 칸 > 가 초동 조치 / 5. > 라 사이버침해 대응 절차", "m12.t1": "정보보안 종합계획 4. \"정보보안사고대응\" 칸 / 5. > 라 사이버침해 대응 절차(경기교육사이버안전센터)", "m12.t2": "정보보안 종합계획 5. > 라 사이버침해 대응 절차(후속조치)", "m12.t3": "개인정보 내부 관리계획 제7장 제23조(유출 등의 통지) / 정보보안 종합계획 5. > 다 \"유·노출 시 조치 대응\" 칸 / 개인정보 보호 업무 추진계획 Ⅲ-8", "m12.t4": "개인정보 내부 관리계획 제24조(유출 등의 신고) / 개인정보 보호 업무 추진계획 Ⅲ-8", "m12.t5": "개인정보 내부 관리계획 제25조(유출 사고 대응) / 정보보안 종합계획 5. > 다 \"유·노출 시 조치 대응\" 칸"};

function monInit(){
  var m=state.mon;
  if(!m){
    var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);
    m=state.mon={rows:DEFROWS.map(function(r){return {id:r.id,cat:r.cat,name:r.name,site:r.site||''};}),staff:DEFSTAFF.map(function(t,i){return {id:'p'+i,role:t[0],docs:t[1],grp:t[2],name:''};}),v:3,months:{},ym:d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)};
  }
  if(!m.v||m.v<2){
    var oldn={};(m.staff||[]).forEach(function(q){if(q.name)oldn[q.role]=q.name;});
    m.staff=DEFSTAFF.map(function(t,i){return {id:'p'+i,role:t[0],docs:t[1],grp:t[2],name:oldn[t[0]]||''};});m.v=3;m.months={};
  }
  if((m.addv||0)<3){m.addv=3;(function(){var have={};m.staff.forEach(function(q){have[q.role]=1;});var ids={};m.staff.forEach(function(q){ids[q.id]=1;});DEFSTAFF.forEach(function(t,i){if(!have[t[0]]){var id='p'+i;while(ids[id])id+='x';ids[id]=1;m.staff.push({id:id,role:t[0],docs:t[1],grp:t[2],name:''});}});})();}
  if(!m.pref1){m.pref1=1;m.staff.forEach(function(q){if(!q.name&&DEFVAL[q.role])q.name=DEFVAL[q.role];});}
  if(!m.pref2){m.pref2=1;m.staff.forEach(function(q){if(q.name&&q.name.indexOf('신지훈')<0&&q.name.indexOf('정보업무 담당자')>=0){q.name=q.name.replace(/정보업무 담당자(?!\s*신지훈)/g,'정보업무 담당자 신지훈').replace('내PC지킴이·Privacy-i: 정보업무 담당자 신지훈','내PC지킴이·Privacy-i: 신지훈');}});}
  if(!m.pref3){m.pref3=1;m.rows.forEach(function(r){if(r.name==='위탁업체 개인정보 처리 점검')r.name='위탁업체 개인정보 처리 점검 (보안서약서, 교육 확인서, 동의서 등)';});}
  if(!m.pref4){m.pref4=1;var dm={};DEFSTAFF.forEach(function(t){dm[t[0]]=t[1];});m.staff.forEach(function(q){if(dm[q.role]!==undefined)q.docs=dm[q.role];});}
  if(m.v!==3){var gm={};DEFSTAFF.forEach(function(t){gm[t[0]]=t[2];});m.staff.forEach(function(q){if(!q.grp)q.grp=gm[q.role]||'기타';});m.v=3;}
  return m;
}
function thirdWed(ym){var y=+ym.slice(0,4),mo=+ym.slice(5,7),dow=new Date(y,mo-1,1).getDay();return 1+((3-dow+7)%7)+14;}
function monData(ym){var m=monInit();if(!m.months[ym])m.months[ym]={res:{},date:'',confirmed:false};return m.months[ym];}
function prevConfirmed(ym){var m=monInit(),ks=Object.keys(m.months).filter(function(k){return k<ym&&m.months[k].confirmed&&m.months[k].staff;}).sort();return ks.length?m.months[ks[ks.length-1]]:null;}
function staffNow(ym){var m=monInit(),md=m.months[ym];return (md&&md.confirmed&&md.staff)?md.staff:m.staff;}
function staffChanges(ym){
  var cur=staffNow(ym),pv=prevConfirmed(ym),out={};
  if(!pv)return out;
  cur.forEach(function(p){var o=pv.staff.filter(function(q){return q.id===p.id;})[0];if(o&&(o.name||'')!==(p.name||''))out[p.id]=o.name||'(비어 있음)';});
  return out;
}
function dayTxt(ym){var md=monData(ym);var d=md.date||(ym+'-'+('0'+thirdWed(ym)).slice(-2));return d;}
function loanSummary(ym){
  var L=loanList(),inM=L.filter(function(x){return String(x.outAt||'').slice(0,7)===ym;});
  var open=L.filter(function(x){return !x.inAt&&String(x.outAt||'').slice(0,7)<=ym;});
  if(!inM.length&&!open.length)return null;
  var c={};inM.forEach(function(x){c[x.kind]=(c[x.kind]||0)+1;});
  var parts=Object.keys(c).map(function(k){return k+' '+c[k];});
  var t=inM.length?'반출 '+inM.length+'건('+parts.join(', ')+')':'이달 신규 반출 없음';
  t+=open.length?', 미반납 '+open.length+'건':(inM.length?', 전부 반납':'');
  return {note:t,res:open.length?'이상 있음':'양호'};
}
function effRes(ym,r){var md=monData(ym),v=md.res[r.id]||{},ls=r.id==='r7'?loanSummary(ym):null;

    return '<li>'+(isImg?'<a href="#" data-fid="'+esc(f.id)+'"><img data-thumb="'+esc(f.id)+'" alt="" class="thumb"></a>':'')+'<a href="#" data-fid="'+esc(f.id)+'">'+esc(f.name)+'</a> <span class="sm2">'+esc(f.date||'')+'</span> <button class="btn" type="button" data-attdel="'+esc(k)+'" data-id="'+esc(f.id)+'">삭제</button></li>';}).join('')+'</ul>';}
  h+='<label class="btn upl">파일 올리기<input type="file" accept="image/*,application/pdf" multiple data-up="'+esc(k)+'" style="display:none"></label> <span class="sm2" data-upmsg="'+esc(k)+'">'+(L.length?L.length+'개 올림':'아직 올린 파일이 없습니다')+'</span></div>';
  return h;
}
view.addEventListener('change',function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute('data-up');if(!k)return;
  var files=[].slice.call(t.files||[]);if(!files.length)return;
  var msgEl=view.querySelector('[data-upmsg="'+k+'"]');
  function msg(s){if(msgEl)msgEl.textContent=s;}
  if(!window.fileUp){msg('로그인 후 올릴 수 있습니다.');return;}
  msg('올리는 중...');
  var n=0,fail=0;
  files.reduce(function(p,f){return p.then(function(){
    if(f.size>10*1024*1024){fail++;return;}
    return fileUp(f).then(function(r){attList(k).push({id:r.id,url:'',ct:r.ct||f.type,name:f.name,date:todayStr()});n++;},function(){fail++;});
  });},Promise.resolve()).then(function(){save();var y=scY();renderAll();scTo(0,y);var m2=view.querySelector('[data-upmsg="'+k+'"]');if(m2)m2.textContent=n+'개 올림'+(fail?', '+fail+'개 실패(10MB 이하만 가능)':'');});
});
view.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-attdel]');if(!b)return;
  var k=b.getAttribute('data-attdel'),id=b.getAttribute('data-id'),y=scY();
  state.att[k]=attList(k).filter(function(f){return f.id!==id;});save();
  try{if(window.fileDel)fileDel(id);}catch(err){}
  renderAll();scTo(0,y);
});

var _ra=renderAll;renderAll=function(){_ra.apply(null,arguments);if(window.hydrateFiles)hydrateFiles();};
STEPS=MODES[state.mode].steps;
if(state.cur<0||state.cur>=STEPS.length||!unlockedStrict(state.cur))state.cur=0;
renderAll();

/* ---------- 로그인, 서버 저장(Apps Script) ---------- */
function gs(fn){var a=[].slice.call(arguments,1);return new Promise(function(res,rej){
  if(!(window.google&&google.script&&google.script.run)){rej(new Error('noserver'));return;}
  var r=google.script.run.withSuccessHandler(res).withFailureHandler(rej);r[fn].apply(r,a);});}
(function(){
  var el=function(i){return document.getElementById(i);};
  var SHARED=['checks','free','urls','info','custom','qa','loans','att','fld','mon'];
  var mode='pick',role=null,roster=[],sess=null,loaded=false,rev=0,sent={},timer=null,pushing=false,urls={};
  function msg(t,ok){var m=el('lockMsg');m.textContent=t||'';m.className=ok?'ok':'';}
  function expired(e){return /expired/.test(String((e&&e.message)||e));}
  function stat(t,bad){var s=el('sync');if(!s)return;s.textContent=t;s.className='sm2 sync'+(bad?' bad':'');}
  function setUI(m){
    mode=m;document.body.classList.add('locked');
    var pick=(m==='pick'),pw=(m==='pw'),setup=(m==='setup'||m==='change');
    el('roleBtns').style.display=pick?'flex':'none';
    el('lockForm').style.display=pick?'none':'block';
    el('nm').style.display=setup?'block':'none';
    el('pw2').style.display=setup?'block':'none';
    el('pw1').style.display='block';
    el('lockBack').style.display=(pw||m==='setup')?'block':'none';
    el('lockCancel').style.display=(m==='change')?'block':'none';
    el('pw1').value='';el('pw2').value='';
    el('pw1').placeholder=setup?'새 암호(4자 이상)':'암호';
    el('pw2').placeholder='새 암호 한 번 더';
    el('lockBtn').textContent=setup?'저장하고 들어가기':'들어가기';
    var sub={pick:'누구로 들어가시나요?',pw:(role?labelOf(role):'')+' 암호를 입력하세요',setup:'처음 접속입니다. 이름과 새 암호를 정해 주세요(6120은 사용할 수 없습니다)',change:'이름과 암호를 바꿉니다'}[m];
    el('lockSub').textContent=sub;
    try{(setup?el('nm'):el('pw1')).focus();}catch(e){}
  }
  function labelOf(r){for(var i=0;i<roster.length;i++)if(roster[i].role===r)return roster[i].label+(roster[i].name&&roster[i].name!==roster[i].label?'('+roster[i].name+')':'');return r;}
  function drawRoster(){
    el('roleBtns').innerHTML=roster.map(function(r){return '<button type="button" class="btn rolebtn" data-role="'+r.role+'"><b>'+esc(r.label)+'</b>'+(r.name&&r.name!==r.label?'<span>'+esc(r.name)+'</span>':'')+(r.first?'<span class="sm2">처음 접속 전</span>':'')+'</button>';}).join('');
  }
  function loadRoster(){
    msg('불러오는 중...');
    gs('getRoster').then(function(r){roster=r;drawRoster();msg('');setUI('pick');}).catch(function(e){
      msg(e&&e.message==='noserver'?'이 화면은 Apps Script 웹앱으로 열어야 로그인됩니다.':'서버에 연결하지 못했습니다. 잠시 뒤 새로고침하세요.');});
  }
  el('roleBtns').addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-role]');if(!b)return;role=b.getAttribute('data-role');msg('');setUI('pw');});
  el('lockBack').addEventListener('click',function(){msg('');setUI('pick');});
  el('lockCancel').addEventListener('click',function(){if(sess){msg('');document.body.classList.remove('locked');}});
  el('lockForm').addEventListener('submit',function(e){
    e.preventDefault();var v=el('pw1').value;
    if(mode==='pw'){
      if(!v)return msg('암호를 입력하세요');
      msg('확인 중...');
      gs('login',role,v).then(function(r){
        if(r.err){msg(r.err);el('pw1').value='';return;}
        sess={token:r.token,role:r.role,name:r.name,label:r.label};
        if(r.first){el('nm').value=(r.name===r.label?'':r.name);setUI('setup');msg('');}
        else enter();
      }).catch(function(){msg('서버에 연결하지 못했습니다.');});
    }else{
      var nm=el('nm').value.trim();
      if(!nm)return msg('이름을 적어 주세요');
      if(v.length<4)return msg('암호는 4자 이상으로 정해 주세요');
      if(v==='6120')return msg('6120은 새 암호로 쓸 수 없습니다');
      if(v!==el('pw2').value)return msg('두 칸이 서로 다릅니다');
      msg('저장 중...');
      gs('setCredentials',sess.token,nm,v).then(function(r){
        if(r.err){msg(r.err);return;}
        sess.name=r.name;
        if(mode==='change'){document.body.classList.remove('locked');showWho();msg('');}
        else enter();
      }).catch(function(e){if(expired(e))relogin();else msg('저장하지 못했습니다.');});
    }
  });
  function showWho(){el('who').textContent=sess.label+(sess.name&&sess.name!==sess.label?' · '+sess.name:'');}
  function relogin(note){document.body.classList.add('locked');role=sess?sess.role:null;sess=null;loadRoster();setTimeout(function(){msg(note||'접속이 끝났습니다. 다시 로그인하세요');},400);}
  function ser(k){return JSON.stringify(state[k]);}
  function apply(resp,initial){
    var d=resp.data||{},changed=false;
    if(initial){
      DEFVAL=resp.defval||{};
      var dev={cur:state.cur,mode:state.mode,curs:state.curs||{}};
      state={checks:{},cur:0,free:false,urls:{},info:{},custom:[],mode:dev.mode,curs:dev.curs};
      SHARED.forEach(function(k){
        sent[k]=d[k];
        if(d[k]!==undefined){try{var v=JSON.parse(d[k]);if(v!==null)state[k]=v;}catch(e){}}
      });
      if(!state.mon)state.mon=null;
      changed=true;
    }else{
      SHARED.forEach(function(k){
        if(d[k]===undefined||d[k]===sent[k])return;
        var local=(state[k]===undefined)?undefined:ser(k);
        if(local===sent[k]){try{var v=JSON.parse(d[k]);if(v!==null)state[k]=v;sent[k]=d[k];changed=true;}catch(e){}}
      });
    }
    rev=resp.rev||0;return changed;
  }
  function enter(){
    msg('불러오는 중...');
    gs('loadState',sess.token).then(function(resp){
      if(!loaded){
        apply(resp,true);loaded=true;
        STEPS=MODES[state.mode].steps;
        if(state.cur<0||state.cur>=STEPS.length||!unlockedStrict(state.cur))state.cur=0;
      }else{apply(resp,false);}
      document.getElementById('reset').style.display=(sess.role==='head')?'':'none';
      el('adm_open').style.display=(sess.role==='head')?'':'none';
      showWho();msg('');document.body.classList.remove('locked');
      renderAll();scTo(0,0);stat('저장됨');
      SYNC.dirty();SYNC.start();
    }).catch(function(e){if(expired(e))relogin();else msg('불러오지 못했습니다. 다시 시도하세요.');});
  }
  var SYNC=window.SYNC={
    dirty:function(){if(!sess||!loaded)return;stat('저장 중...');clearTimeout(timer);timer=setTimeout(SYNC.push,1500);},
    push:function(){
      if(!sess||!loaded||pushing)return;clearTimeout(timer);timer=null;
      var ch={},any=false;
      SHARED.forEach(function(k){if(state[k]===undefined)return;var s=ser(k);if(s!==sent[k]){ch[k]=s;any=true;}});
      if(!any){stat('저장됨');return;}
      pushing=true;
      gs('saveKeys',sess.token,ch,rev).then(function(r){
        Object.keys(ch).forEach(function(k){sent[k]=ch[k];});rev=r.rev;pushing=false;
        stat('저장됨');
        if(r.behind)SYNC.pull();
        SHARED.forEach(function(k){if(state[k]!==undefined&&ser(k)!==sent[k])SYNC.dirty();});
      }).catch(function(e){pushing=false;if(expired(e)){relogin('접속이 끝났습니다. 다시 로그인하면 입력한 내용이 저장됩니다');}else{stat('저장 실패, 다시 시도 중',true);timer=setTimeout(SYNC.push,6000);}});
    },
    pull:function(){
      if(!sess||!loaded||pushing||timer)return;
      var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&el('view').contains(a))return;
      gs('loadState',sess.token).then(function(resp){
        if(apply(resp,false)){var y=scY();renderAll();scTo(0,y);}
      }).catch(function(e){if(expired(e))relogin();});
    },
    start:function(){
      if(SYNC._t)return;
      SYNC._t=setInterval(function(){
        if(!sess||!loaded||document.hidden||pushing||timer)return;
        gs('getRev',sess.token).then(function(r){if(r.rev>rev)SYNC.pull();}).catch(function(e){if(expired(e))relogin();});
      },15000);
    }
  };
  document.addEventListener('visibilitychange',function(){if(document.hidden)SYNC.push();else if(sess&&loaded)SYNC.pull();});
  window.addEventListener('pagehide',function(){SYNC.push();});
  /* 파일 */
  window.fileUp=function(f){return new Promise(function(res,rej){
    if(!sess){rej();return;}
    var fr=new FileReader();
    fr.onload=function(){var b64=String(fr.result).split(',')[1]||'';
      gs('uploadFile',sess.token,f.name,f.type||'application/octet-stream',b64).then(function(r){r.err?rej(new Error(r.err)):res(r);},rej);};
    fr.onerror=rej;fr.readAsDataURL(f);});};
  window.fileDel=function(id){if(sess)gs('deleteFile',sess.token,id).catch(function(){});};
  function toBlob(b64,ct){var bin=atob(b64),n=bin.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:ct||'application/octet-stream'});}
  function getUrl(id){
    if(urls[id])return Promise.resolve(urls[id]);
    return gs('getFile',sess.token,id).then(function(r){if(r.err)throw new Error(r.err);urls[id]={url:URL.createObjectURL(toBlob(r.b64,r.ct)),name:r.name,ct:r.ct};return urls[id];});}
  function openBlobUrl(o,name){
    var w=null;try{w=window.open(o.url,'_blank');}catch(e){}
    if(!w){var a=document.createElement('a');a.href=o.url;a.download=name||o.name||'file';document.body.appendChild(a);a.click();document.body.removeChild(a);}
  }
  window.hydrateFiles=function(){
    if(!sess)return;
    [].forEach.call(document.querySelectorAll('img[data-thumb]'),function(im){
      var id=im.getAttribute('data-thumb');if(im.getAttribute('data-ok'))return;im.setAttribute('data-ok','1');
      getUrl(id).then(function(o){im.src=o.url;}).catch(function(){im.alt='(미리보기 없음)';});});
  };
  document.addEventListener('click',function(e){
    var f=e.target.closest&&e.target.closest('[data-fid]');
    if(f){e.preventDefault();var id=f.getAttribute('data-fid');getUrl(id).then(function(o){openBlobUrl(o,f.textContent);}).catch(function(){});return;}
    var d=e.target.closest&&e.target.closest('[data-edu]');
    if(d&&sess){e.preventDefault();
      if(urls.edu){openBlobUrl(urls.edu,'수탁자_개인정보_보호_교육자료.pdf');return;}
      gs('getEdu',sess.token).then(function(r){urls.edu={url:URL.createObjectURL(toBlob(r.b64,r.ct)),name:r.name};openBlobUrl(urls.edu,r.name);}).catch(function(){});}
  });
  /* 내 이름·암호 변경, 로그아웃 */
  el('chgpw').addEventListener('click',function(){if(!sess)return;el('nm').value=sess.name||'';setUI('change');msg('');});
  el('dolock').addEventListener('click',function(){SYNC.push();sess=null;loaded=loaded;role=null;urls={};loadRoster();});
  /* 정보부장: 담당자 관리 */
  function fmt(t){var d=new Date(t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function admMsg(t){el('admMsg').textContent=t||'';}
  function admDraw(){
    gs('adminList',sess.token).then(function(r){
      var h='<table class="admt"><tr><th>구분</th><th>이름</th><th>암호 변경일</th><th>상태</th><th></th></tr>';
      r.roles.forEach(function(x){
        var old=x.days>=365;
        h+='<tr><td>'+esc(x.label)+'</td><td>'+esc(x.name)+'</td><td>'+fmt(x.changed)+' ('+x.days+'일 전)'+(old&&x.role!=='head'?' <b class="warnb">1년 경과</b>':'')+'</td><td>'+(x.first?'첫 접속 대기':'사용 중')+'</td><td>'+(x.role==='head'?'':'<button class="btn sm" type="button" data-admreset="'+x.role+'">초기화</button>')+'</td></tr>';
      });
      h+='</table>';
      h+='<h3>최근 저장 기록</h3><ul class="sm2">'+(r.log.length?r.log.map(function(l){return '<li>'+fmt(l.at)+' '+new Date(l.at).toTimeString().slice(0,5)+' '+esc(l.by)+' · '+esc((l.keys||[]).join(', '))+'</li>';}).join(''):'<li>아직 없습니다</li>')+'</ul>';
      el('admBody').innerHTML=h;
    }).catch(function(e){if(expired(e)){el('adm').hidden=true;relogin();}else admMsg('불러오지 못했습니다');});
  }
  el('adm_open').addEventListener('click',function(){el('adm').hidden=false;admMsg('');admDraw();});
  el('admClose').addEventListener('click',function(){el('adm').hidden=true;});
  el('admBody').addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-admreset]');if(!b)return;
    if(b.getAttribute('data-arm')!=='1'){b.setAttribute('data-arm','1');b.textContent='이름과 암호가 지워집니다. 한 번 더';setTimeout(function(){b.removeAttribute('data-arm');b.textContent='초기화';},4000);return;}
    gs('adminReset',sess.token,b.getAttribute('data-admreset')).then(function(r){admMsg(r.err||'초기화했습니다. 암호는 6120이고, 첫 접속 때 이름과 새 암호를 정하게 됩니다');admDraw();}).catch(function(){admMsg('초기화하지 못했습니다');});
  });
  el('impGo').addEventListener('click',function(){
    var t=el('impTxt').value.trim();if(!t)return admMsg('붙여넣은 내용이 없습니다');
    if(el('impGo').getAttribute('data-arm')!=='1'){el('impGo').setAttribute('data-arm','1');el('impGo').textContent='서버 내용이 덮어써집니다. 한 번 더';setTimeout(function(){el('impGo').removeAttribute('data-arm');el('impGo').textContent='가져오기';},4000);return;}
    el('impGo').removeAttribute('data-arm');el('impGo').textContent='가져오기';
    gs('importState',sess.token,t).then(function(r){
      if(r.err)return admMsg(r.err);
      admMsg(r.n+'개 항목을 가져왔습니다. 화면을 새로 불러옵니다');
      gs('loadState',sess.token).then(function(resp){SHARED.forEach(function(k){delete state[k];});state.checks={};apply(resp,true);var y=scY();renderAll();scTo(0,y);});
    }).catch(function(){admMsg('가져오지 못했습니다');});
  });
  loadRoster();
})();

</script>
